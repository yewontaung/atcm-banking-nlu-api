{% extends "layouts/auth-layout.html" %}

{% block title %}Sign In - ATCM Banking API{% endblock %}

{% block content %}
<div class="auth-header">
  <div class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
    <div class="logo-icon"><i class="fas fa-brain"></i></div>
    <span>ATCM Platform</span>
  </div>
  <h1 class="auth-title">Welcome Back</h1>
  <p class="auth-subtitle">Sign in to manage your ATCM Banking API Keys</p>
</div>

{% if error %}
<div style="background: var(--danger-bg); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px; text-align: center;">
  <i class="fas fa-exclamation-circle"></i> {{ error }}
</div>
{% endif %}

<!-- Quick Fill Helper Buttons -->
<div style="display: none; gap: 8px; margin-bottom: 16px; justify-content: center;">
  <button type="button" id="fillUserSignIn" class="btn btn-secondary btn-sm" style="flex: 1;">
    <i class="fas fa-user" style="color: var(--primary);"></i> User Fill
  </button>
  <button type="button" id="fillAdminSignIn" class="btn btn-secondary btn-sm" style="flex: 1;">
    <i class="fas fa-user-shield" style="color: var(--accent-cyan);"></i> Admin Fill
  </button>
</div>

<form action="/web/auth/sign-in" method="POST">
  <div class="form-group">
    <label class="form-label" for="email">Email Address <span class="required">*</span></label>
    <div class="input-group">
      <span class="input-icon-left"><i class="fas fa-envelope"></i></span>
      <input type="email" id="email" name="email" class="form-control input-with-icon-left" placeholder="name@company.com" required autocomplete="email">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="password">Password <span class="required">*</span></label>
    <div class="input-group">
      <span class="input-icon-left"><i class="fas fa-lock"></i></span>
      <input type="password" id="password" name="password" class="form-control input-with-icon-left" placeholder="••••••••" required autocomplete="current-password">
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 20px;">
    Sign In <i class="fas fa-arrow-right"></i>
  </button>
</form>

<div class="auth-footer">
  Don't have an account? <a href="/web/auth/sign-up" style="font-weight: 600;">Sign up here</a>
</div>
{% endblock %}
